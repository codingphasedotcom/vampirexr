<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VampiresXR</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; color: #eee; }
    canvas { display: block; }
    #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; z-index: 10;
      background: linear-gradient(rgba(4, 2, 10, .35), rgba(4, 2, 10, .85)), url('/img/keyart.jpg') center / cover no-repeat; }
    #logo { width: min(640px, 80vw); mix-blend-mode: screen; filter: drop-shadow(0 0 24px rgba(255, 60, 100, .5)); }
    #ovTitle.small { font-size: 34px; letter-spacing: 3px; }
    #overlay.hidden, #crosshair.hidden { display: none; }
    #overlay h1 { font-size: 60px; margin: 0; letter-spacing: 6px; color: #ff4d6d; text-shadow: 0 0 28px #ff4d6d; }
    #overlay p { max-width: 540px; line-height: 1.6; color: #bbb; margin: 0; }
    #overlay small { color: #777; align-self: center; }
    button { font: inherit; font-size: 20px; padding: 12px 28px; border: 2px solid #ff4d6d; background: #14101c; color: #fff; border-radius: 8px; cursor: pointer; }
    button:hover { background: #ff4d6d; }
    .row { display: flex; gap: 12px; align-items: center; }
    .settings { font-size: 14px; color: #999; gap: 18px; margin-top: 6px; }
    .settings select { font: inherit; background: #14101c; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 2px 6px; }
    #crosshair { position: fixed; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #fff; box-shadow: 0 0 6px #000; z-index: 5; pointer-events: none; }
  </style>
</head>
<body>
  <div id="crosshair" class="hidden"></div>
  <div id="overlay">
    <img id="logo" src="/img/logo.png" alt="VampiresXR">
    <h1 id="ovTitle" class="small" hidden></h1>
    <p id="ovMsg"></p>
    <div class="row">
      <button id="playDesktop">Play on Desktop</button>
      <div id="vrButtonHolder"></div>
    </div>
    <div class="row settings">
      <label>Turn <select id="setTurn"><option value="smooth">Smooth</option><option value="snap">Snap 45°</option></select></label>
      <label>Comfort vignette <select id="setVignette"><option value="1">On</option><option value="0">Off</option></select></label>
      <label>VR HUD <select id="setHud"><option value="wrist">Wrist</option><option value="camera">Fixed</option></select></label>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
